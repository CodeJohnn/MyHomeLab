<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brasões de nobreza • HomeLab</title>
<style>body{margin:0;padding:32px;background:#101014;color:#eee;font:14px/1.5 system-ui}h1{font-weight:500}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px}article{text-align:center;background:#1c1b23;border:1px solid #ffffff22;border-radius:14px;padding:20px}img{width:120px;height:116px}h2{font-size:18px;margin:8px}p{font-size:12px;color:#bbb}header{margin-bottom:28px}header p{font-size:14px}</style>
<header><h1>Nobreza do HomeLab</h1><p>Camponês a Imperador • galeria visual dos onze títulos</p></header><main></main>
<script type="module">import {nobleTitles} from '../../js/nobility.mjs';import {nobleCrestUrl} from '../../js/nobility-effects.mjs';for(const title of nobleTitles){const card=document.createElement('article'),crest=document.createElement('img'),name=document.createElement('h2'),range=document.createElement('p');crest.src=nobleCrestUrl(title.id);crest.alt='Brasão '+title.name;name.textContent=title.name;name.style.color=title.color;range.textContent=title.maxLevel?`Níveis ${title.minLevel}–${title.maxLevel}`:`Nível ${title.minLevel}+`;card.append(crest,name,range);document.querySelector('main').append(card);}</script></html>
