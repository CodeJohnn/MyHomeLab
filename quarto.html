let prev=performance.now(),walk=0;function loop(t){requestAnimationFrame(loop);let dt=Math.min((t-prev)/1000,.05);prev=t;if(document.querySelector('#modal').style.display!=='flex'){let dx=0,dz=0;if(keys.has('w')||keys.has('arrowup'))dz-=1;if(keys.has('s')||keys.has('arrowdown'))dz+=1;if(keys.has('a')||keys.has('arrowleft'))dx-=1;if(keys.has('d')||keys.has('arrowright'))dx+=1;const len=Math.hypot(dx,dz);if(len){dx/=len;dz/=len;let nx=avatar.position.x+dx*dt*2.5,nz=avatar.position.z+dz*dt*2.5;avatar.position.x=THREE.MathUtils.clamp(nx,-3.75,3.75);avatar.position.z=THREE.MathUtils.clamp(nz,-2.05,2.85);avatar.rotation.y=Math.atan2(dx,dz);walk+=dt*11;legs.forEach((a,i)=>a.rotation.x=Math.sin(walk+i*Math.PI)*.55);arms.forEach((a,i)=>a.rotation.x=-Math.sin(walk+i*Math.PI)*.4)}else{legs.forEach(a=>a.rotation.x=0);arms.forEach(a=>a.rotation.x=0)}}near=null;let dist=1.55;for(const obj of interactables){const d=avatar.position.distanceTo(obj.pos);if(d<dist){dist=d;near=obj}}document.querySelector('#prompt').style.display=near?'block':'none';if(near)document.querySelector('#prompt').textContent='E • '+near.name;document.querySelector('#status').textContent=near?'Perto de: '+near.name:'Explore o escritório!';renderer.render(scene,camera)}requestAnimationFrame(loop);
